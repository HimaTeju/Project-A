<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chathurya Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --accent-primary: #7b1fa2; /* purple[700] */
            --accent-focus: #ba68c8; /* purple[400] */
            --accent-gradient-start: #7b1fa2; /* purple[700] */
            --accent-gradient-end: #2196f3; /* blue[500] */
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0; /* grey[300] */
            --text-tertiary: #757575; /* grey[600] */
            --border-radius: 12px;
            --button-height: 56px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .sidebar {
            min-height: 100vh;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-right: 1px solid var(--bg-primary);
        }

        .sidebar .nav-link {
            color: var(--text-secondary);
            margin-bottom: 5px;
            border-radius: var(--border-radius);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .sidebar .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        .sidebar .nav-link.active {
            color: var(--text-primary);
            background: var(--accent-primary);
        }

        .sidebar .nav-link i {
            width: 24px;
            text-align: center;
            margin-right: 12px;
        }

        .main-content {
            background: var(--bg-primary);
            padding: 24px;
        }

        /* Branding */
        .brand-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--text-secondary);
            margin: 20px 0;
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--accent-primary);
            border: none;
            color: var(--text-primary);
            height: var(--button-height);
            border-radius: var(--border-radius);
            font-weight: bold;
            font-size: 16px;
            padding: 0 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary:hover {
            background-color: var(--accent-focus);
        }

        .btn-primary:disabled {
            background-color: #4a148c; /* purple[900] */
        }

        /* Input Fields */
        .form-control {
            background-color: var(--bg-secondary);
            border: none;
            color: var(--text-primary);
            border-radius: var(--border-radius);
            padding: 12px 16px;
            height: var(--button-height);
        }

        .form-control:focus {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: 0 0 0 2px var(--accent-focus);
        }

        /* Breadcrumbs */
        .breadcrumb {
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 12px 16px;
        }

        .breadcrumb-item a {
            color: var(--accent-focus);
            text-decoration: none;
        }

        /* Cards */
        .card {
            background-color: var(--bg-secondary);
            border: none;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
        }

        .card-header {
            background-color: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--bg-primary);
            font-weight: bold;
        }

        /* Decorative Elements */
        .gradient-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gradient-start), var(--accent-gradient-end));
            position: absolute;
            filter: blur(15px);
            opacity: 0.3;
            z-index: -1;
        }

        /* Feedback Messages */
        .alert-success {
            background-color: #66bb6a; /* green[400] */
            color: white;
            border: none;
        }

        .alert-danger {
            background-color: #ef5350; /* red[400] */
            color: white;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="brand-text">
                            <i class="fas fa-qrcode me-2"></i>
                            CHATHURYA
                        </h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if 'dashboard' in request.path %}active{% endif %}" href="{% url 'dashboard' %}">
                                <i class="fas fa-home"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if 'events' in request.path %}active{% endif %}" href="{% url 'event_list' %}">
                                <i class="fas fa-calendar-alt"></i> Events
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto main-content">
                <!-- Breadcrumbs -->
                <nav aria-label="breadcrumb" class="mb-4">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="{% url 'event_list' %}">Home</a></li>
                        {% block breadcrumbs %}{% endblock %}
                    </ol>
                </nav>

                <!-- Content -->
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Decorative elements -->
    <div class="gradient-circle" style="top: -50px; right: -50px;"></div>
    <div class="gradient-circle" style="bottom: -50px; left: -50px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.querySelector('.sidebar');
            // Add toggle button in your navbar if needed
        });
    </script>
</body>
</html>
